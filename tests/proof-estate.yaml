# music-chairs proof estate. Generated at stamp from this repository's own inventory;
# families, sizes, tiers and risk judgments are local. Sizes come from the first full run.
schema: agentic.proof_estate.v3
baseline_report: reports/test-governance/music-chairs-pre-reset-baseline.json
audit_ledger: reports/test-governance/music-chairs-reset.jsonl
effectiveness_corpus: tests/fixtures/test_governance/corpus.yaml
effectiveness_report: reports/test-governance/music-chairs-effectiveness.jsonl
effectiveness_floors:
  min_historical_recall: 0.8
  min_mutant_recall: 0.8
  min_historical_cases: 0
  min_mutant_cases: 0
size_ceilings_seconds:
  small: 2
  medium: 20
  large: 200
time_budget:
  test_lane_seconds: 150
  tolerance: 0.25
  reference_machine: null
critical_risks:
  custody:
    state: applicable
    direct_proof: pytest:tests/test_check_receipt.py::test_passed_run_is_durable_and_reusable_for_exact_clean_head
  security:
    state: applicable
    direct_proof: pytest:tests/test_hermeticity.py::test_real_network_egress_fails_loudly
  authority:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_evidence.py::test_change_manifest_is_candidate_bound_and_detects_authority_drift
  concurrency:
    state: applicable
    direct_proof: pytest:tests/test_execution_telemetry.py::test_concurrent_process_mutations_do_not_lose_spans
  atomicity:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_config.py::test_invalid_edit_is_atomic
  corruption:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_evidence.py::test_validate_detects_corrupt_evidence
  recovery:
    state: applicable
    direct_proof: pytest:tests/test_execution_telemetry.py::test_lifecycle_idempotency_finalization_and_crash_recovery
  public-contract:
    state: applicable
    direct_proof: gate:test
  schema:
    state: applicable
    direct_proof: pytest:tests/test_test_governance.py::test_live_reset_validates
  core-success:
    state: applicable
    direct_proof: pytest:tests/test_check.py::test_all_is_default_locked_ordered_and_cwd_independent
  deploy:
    state: applicable
    direct_proof: pytest:tests/test_deploy.py::test_deploy_refuses_any_account_but_the_configured_one
families:
- id: deploy
  kind: pytest
  selectors:
  - tests/test_deploy.py
  source_paths:
  - bin/deploy
  - project/deploy/config.json
  - project/deploy/stack.yaml
  - project/deploy/alerts.yaml
  - project/deploy/install-release.sh
  - project/deploy/provision.sh
  - project/deploy/backup.sh
  - tests/test_deploy.py
  covers:
  - bin/deploy
  - project/deploy/config.json
  - project/deploy/stack.yaml
  - project/deploy/alerts.yaml
  - project/deploy/install-release.sh
  - project/deploy/provision.sh
  - project/deploy/backup.sh
  - tests/test_deploy.py
  contract: The deploy command acts only on the configured AWS account, never replaces the instance
    holding the live database, never prompts or leaks the alert email, and a failed release restores
    the database copy and the previous release.
  risk_class: deploy
  oracle: Recorded calls of fake aws and ssh executables, exit statuses and messages from the real
    entry point, parsed CloudFormation templates, and the file system left by install-release.sh with
    fake systemctl, curl and sqlite3.
  admission: 'Phase 5: the deploy critical risk became applicable when bin/deploy was added.'
  nearest_overlap: No other family proves deployment behaviour.
  historical_evidence: []
  mutation_evidence:
  - 'account comparison disabled in bin/deploy: test_deploy_refuses_any_account_but_the_configured_one
    fails'
  - 'replacement check disabled in bin/deploy: test_a_change_set_that_would_replace_the_instance_is_refused
    fails'
  - 'database restore removed from install-release.sh: test_a_release_that_fails_its_health_check_restores_the_data_and_the_previous_release
    fails'
  tier: changed
  size: small
  flake_rate: 0.0
  replacement_lineage: []
