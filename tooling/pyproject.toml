[project]
name = "music-chairs-tooling"
version = "0.1.0"
description = "Governance environment for music-chairs: runs the universal methodology managers under bin/ and the root tests/ suite. Holds no source."
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pyyaml>=6.0,<7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
required-version = ">=0.9.26"
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
