# music-chairs alerts in us-east-1, where Route 53 health-check metrics and AWS
# billing live: an outage alarm on a plain-HTTP health check (the cheap basic
# check; Caddy serves /healthz over port 80 without redirecting) and a monthly
# cost budget. Both email the operator, whose address is a NoEcho parameter
# supplied at deploy time and never stored in the repository.
AWSTemplateFormatVersion: "2010-09-09"
Description: music-chairs outage and cost alerts

Parameters:
  DomainName:
    Type: String
  AlertEmail:
    Type: String
    NoEcho: true
  MonthlyBudgetUsd:
    Type: Number

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint:
            Ref: AlertEmail

  HealthCheck:
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTP
        FullyQualifiedDomainName:
          Ref: DomainName
        Port: 80
        ResourcePath: /healthz
        RequestInterval: 30
        FailureThreshold: 3
      HealthCheckTags:
        - Key: Name
          Value:
            Ref: DomainName

  OutageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription:
        Fn::Join:
          - ""
          - - Ref: DomainName
            - " is not answering its health check"
      Namespace: AWS/Route53
      MetricName: HealthCheckStatus
      Dimensions:
        - Name: HealthCheckId
          Value:
            Ref: HealthCheck
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Ref: AlertTopic
      OKActions:
        - Ref: AlertTopic

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: music-chairs-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount:
            Ref: MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        # Actual spend above the limit ($10).
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address:
                Ref: AlertEmail
        # Forecast above 95% of the limit ($9.50); expected steady cost is about $8.40.
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 95
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address:
                Ref: AlertEmail
