# music-chairs in us-west-2: one Lightsail instance with a static IPv4 address,
# the DNS record for the site, the private bucket the nightly backup writes, and
# the key that lets the server read the Google client secret.
# Long-form intrinsics only, so the template parses as plain YAML in tests.
#
# The instance holds the live database: it, its static IP and the backup bucket
# are retained if the stack is ever deleted or a change would replace them, and
# bin/deploy refuses any change set that replaces or removes the instance.
AWSTemplateFormatVersion: "2010-09-09"
Description: music-chairs application server, DNS record and backup bucket

Parameters:
  InstanceName:
    Type: String
  BundleId:
    Type: String
  BlueprintId:
    Type: String
  AvailabilityZone:
    Type: String
  KeyPairName:
    Type: String
  DomainName:
    Type: String
  HostedZoneId:
    Type: String
  GoogleSecretParameter:
    Type: String
    Description: Parameter Store name of the Google OAuth client secret (starts with /)

Resources:
  Instance:
    Type: AWS::Lightsail::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      InstanceName:
        Ref: InstanceName
      BundleId:
        Ref: BundleId
      BlueprintId:
        Ref: BlueprintId
      AvailabilityZone:
        Ref: AvailabilityZone
      KeyPairName:
        Ref: KeyPairName
      Networking:
        # SSH stays open to all addresses on purpose: key-only authentication,
        # and the operator's own address changes (see project/deploy/README.md).
        Ports:
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
          - FromPort: 80
            ToPort: 80
            Protocol: tcp
          - FromPort: 443
            ToPort: 443
            Protocol: tcp

  StaticIp:
    Type: AWS::Lightsail::StaticIp
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      StaticIpName:
        Fn::Join:
          - "-"
          - - Ref: InstanceName
            - ip
      AttachedTo:
        Ref: Instance

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Ref: DomainName
      Type: A
      TTL: "300"
      ResourceRecords:
        - Fn::GetAtt:
            - StaticIp
            - IpAddress

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: keep-30-days
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: remove-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # The instance can only add backups; it cannot read, list or delete them, and
  # versioning keeps an overwritten copy for 30 days.
  BackupUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: put-backups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Join:
                    - ""
                    - - Fn::GetAtt:
                          - BackupBucket
                          - Arn
                      - /backups/*

  # Reads one parameter, the Google client secret, and nothing else. Its key is
  # root-only on the server (bin/deploy, fetch-secret.sh).
  AppUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: read-google-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:aws:ssm:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - ":parameter"
                      - Ref: GoogleSecretParameter
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService:
                      Fn::Join:
                        - ""
                        - - ssm.
                          - Ref: AWS::Region
                          - .amazonaws.com

Outputs:
  StaticIpAddress:
    Value:
      Fn::GetAtt:
        - StaticIp
        - IpAddress
  BackupBucketName:
    Value:
      Ref: BackupBucket
  BackupUserName:
    Value:
      Ref: BackupUser
  AppUserName:
    Value:
      Ref: AppUser
